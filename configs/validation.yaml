project:
  name: "Northstar Model Validation"
  version: "1.0"

data:
  train_path: "data/raw/application_train.csv"
  target: "TARGET"
  id_column: "SK_ID_CURR"
  validation_size: 0.20
  random_state: 42

model:
  package_dir: "model/model_package"
  model_file: "model.joblib"
  preprocessing_file: "preprocessing.joblib"
  threshold: 0.50

validation:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  risk_bands: 10
  segment_bins: 4
  min_segment_size: 1000
  min_bad_count: 30

outputs:
  directory: "reports"
